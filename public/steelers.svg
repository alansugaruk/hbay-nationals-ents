<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="The Steelers steel band — placeholder image">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0e2440"/>
      <stop offset="1" stop-color="#123156"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pan" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="620" cy="150" r="150" fill="url(#sun)" opacity="0.55"/>

  <!-- steel pans, viewed from above -->
  <g opacity="0.95">
    <ellipse cx="300" cy="300" rx="150" ry="86" fill="url(#pan)"/>
    <ellipse cx="300" cy="300" rx="150" ry="86" fill="none" stroke="#e0fbff" stroke-opacity="0.5" stroke-width="3"/>
    <ellipse cx="300" cy="296" rx="110" ry="60" fill="none" stroke="#0a1628" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse cx="270" cy="290" rx="34" ry="20" fill="none" stroke="#0a1628" stroke-opacity="0.4" stroke-width="2"/>
    <ellipse cx="340" cy="288" rx="30" ry="18" fill="none" stroke="#0a1628" stroke-opacity="0.4" stroke-width="2"/>
    <ellipse cx="300" cy="316" rx="40" ry="22" fill="none" stroke="#0a1628" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <g opacity="0.9">
    <ellipse cx="520" cy="330" rx="120" ry="70" fill="url(#pan)"/>
    <ellipse cx="520" cy="330" rx="120" ry="70" fill="none" stroke="#e0fbff" stroke-opacity="0.5" stroke-width="3"/>
    <ellipse cx="520" cy="326" rx="86" ry="48" fill="none" stroke="#0a1628" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse cx="498" cy="322" rx="26" ry="15" fill="none" stroke="#0a1628" stroke-opacity="0.4" stroke-width="2"/>
    <ellipse cx="548" cy="322" rx="24" ry="14" fill="none" stroke="#0a1628" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <text x="60" y="90" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="800" fill="#e2f7ff">The Steelers</text>
  <text x="62" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#22d3ee">Treviglas Academy Steel Band</text>
  <text x="62" y="418" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" opacity="0.85">Placeholder — swap in Tropical Pressure Festival photo</text>
</svg>
